  for(const o of orders){ const f = firms.get(o.firm_id); const k = invIndex.get(o.investor_id); if(!f || k === undefined) continue; const [ix,iy] = investorPos(k, invs.length); const fx=sx(f.x), fy=sy(f.y); const alpha = Math.min(0.75, 0.12 + Math.log1p(o.value) / 12); ctx.strokeStyle = o.side === 'buy' ? `rgba(34,197,94,${alpha})` : `rgba(239,68,68,${alpha})`; ctx.lineWidth = Math.max(0.6, Math.min(4, Math.log1p(o.value))) * devicePixelRatio; ctx.beginPath(); ctx.moveTo(ix,iy); ctx.lineTo(fx,fy); ctx.stroke(); }
  const fs = firmByDay.get(day) || [];
  for(const d of fs){ const f = firms.get(d.firm_id); if(!f) continue; const rad = (4 + 45*Math.sqrt(Math.max(d.market_weight || 0, 0))) * devicePixelRatio; ctx.fillStyle = colorRet(d.return); ctx.beginPath(); ctx.arc(sx(f.x), sy(f.y), rad, 0, 2*Math.PI); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 0.8 * devicePixelRatio; ctx.stroke(); }
  const past = DATA.paths.filter(d => d.day <= day);
  drawSparkline(past, 'sp500_abs', W*0.04, H*0.035, W*0.36, H*0.09, '#f8fafc');
  drawSparkline(past, 'DGS10_abs', W*0.04, H*0.15, W*0.36, H*0.09, '#f59e0b');
  ctx.fillStyle = '#e5e7eb'; ctx.font = `${13*devicePixelRatio}px sans-serif`; ctx.fillText('SP500 level', W*0.04, H*0.03); ctx.fillText('DGS10 level', W*0.04, H*0.145);
  const p = pathByDay.get(day) || {};
  statusEl.innerHTML = `<b>day ${day}</b> / ${p.Date || ''}<br>` + `SP500=${Number(p.sp500_abs||0).toFixed(2)}, r=${Number(p.sp500||0).toFixed(4)}<br>` + `DGS10=${Number(p.DGS10_abs||0).toFixed(3)}, Δ=${Number(p.DGS10||0).toFixed(4)}<br>` + `orders shown=${orders.length}`;
  topOrdersEl.innerHTML = '<b>Top orders</b><br>' + orders.slice(0,8).map(o => `${o.side} inv${o.investor_id} → firm${o.firm_id}: ${Number(o.value).toExponential(2)}`).join('<br>');
}
function setIdx(v){ idx = Math.max(0, Math.min(DATA.days.length-1, v)); slider.value = idx; draw(); }
slider.addEventListener('input', e => setIdx(+e.target.value));
document.getElementById('play').onclick = () => { if(timer) return; timer = setInterval(() => setIdx((idx+1)%DATA.days.length), 350); };
document.getElementById('pause').onclick = () => { clearInterval(timer); timer=null; };
resize();
</script>
